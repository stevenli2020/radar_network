version: "3.9"
services:
  nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www:/var/www/certbot/
      - ./certbot/conf/:/etc/letsencrypt/
    networks:
      - net01
    depends_on:
      - web
      - certbot
    # reload nginx periodically to pick up renewed certs without manual restarts
    command: >
      /bin/sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/www:/var/www/certbot/
      - ./certbot/conf/:/etc/letsencrypt/
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

  web:
    build:
      context: ./api
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./api:/code
    environment:
      FLASK_APP: app.py
      FLASK_DEBUG: 1
      TZ: Asia/Singapore
    depends_on:
      - redis
    networks:
      - net01

  redis:
    image: "redis:latest"
    restart: always
    networks:
      - net01

networks:
  net01:
    external: true